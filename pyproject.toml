[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conclave-cli"
dynamic = ["version"]
description = "Claude leads a task and consults Gemini and OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9", "prompt_toolkit>=3.0.43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
conclave = "conclave:main"

[tool.setuptools]
py-modules = ["conclave"]

[tool.setuptools.dynamic]
version = {attr = "conclave.__version__"}
