[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conclave-cli"
dynamic = ["version"]
description = "Bring Claude Code projects and conversations to a council: Claude leads, Gemini and Codex advise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9", "prompt_toolkit>=3.0.43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
conclave = "conclave:main"
conclave-app = "conclave_app:main"

[tool.setuptools]
py-modules = ["conclave", "conclave_agents", "conclave_context", "conclave_app"]

[tool.setuptools.dynamic]
version = {attr = "conclave.__version__"}
