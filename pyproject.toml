[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council-cli"
version = "0.1.0"
description = "Claude leads a task and consults Gemini and OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9"]

[project.scripts]
aicouncil = "aicouncil:main"

[tool.setuptools]
py-modules = ["aicouncil"]
